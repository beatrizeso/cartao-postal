<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Cartões Postais</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <h1>Meus Cartões Postais 📬</h1>
    <p class="instrucao">Clique em cada cartão para ver o verso</p>

    <div class="cartoes-container">
        <div class="cartao">
            <div class="cartao-inner">
                <div class="cartao-front">
                    <img src="imagens/frente1.jpeg" alt="Frente do cartão 1">
                </div>
                <div class="cartao-back">
                    <img src="imagens/verso1.jpeg" alt="Verso do cartão 1">
                </div>
            </div>
        </div>

        <div class="cartao">
            <div class="cartao-inner">
                <div class="cartao-front">
                    <img src="imagens/frente2.jpeg" alt="Frente do cartão 2">
                </div>
                <div class="cartao-back">
                    <img src="imagens/verso2.jpeg" alt="Verso do cartão 2">
                </div>
            </div>
        </div>

        <div class="cartao">
            <div class="cartao-inner">
                <div class="cartao-front">
                    <img src="imagens/frente3.jpeg" alt="Frente do cartão 3">
                </div>
                <div class="cartao-back">
                    <img src="imagens/verso3.jpeg" alt="Verso do cartão 3">
                </div>
            </div>
        </div>

        <div class="cartao">
            <div class="cartao-inner">
                <div class="cartao-front">
                    <img src="imagens/frente4.jpeg" alt="Frente do cartão 4">
                </div>
                <div class="cartao-back">
                    <img src="imagens/verso4.jpeg" alt="Verso do cartão 4">
                </div>
            </div>
        </div>

        <div class="cartao">
            <div class="cartao-inner">
                <div class="cartao-front">
                    <img src="imagens/frente5.jpeg" alt="Frente do cartão 5">
                </div>
                <div class="cartao-back">
                    <img src="imagens/verso5.jpeg" alt="Verso do cartão 5">
                </div>
            </div>
        </div>
    </div>

    <script>
        document.querySelectorAll('.cartao').forEach(cartao => {
            cartao.addEventListener('click', () => {
                cartao.classList.toggle('flipped');
            });
        });
    </script>
</body>
</html>
