<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Cartões Postais</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      gap: 20px;
      padding: 30px;
      background: #8f1010;
    }

    p.instrucao {
      font-size: 18px;
      text-align: center;
      font-weight: bold;
      margin-bottom: 20px;
      color: #000000;
    }

    .flip-card {
      background-color: transparent;
      width: 90%;
      max-width: 400px;
      height: 200px;
      perspective: 1000px;
      cursor: pointer;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.8s;
      transform-style: preserve-3d;
    }

    .flip-card.flipped .flip-card-inner {
      transform: rotateY(180deg);
    }

    .flip-card-front, .flip-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 10px;
      overflow: hidden;
    }

    .flip-card-front img,
    .flip-card-back img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .flip-card-back {
      transform: rotateY(180deg);
    }

    @media (max-width: 500px) {
      .flip-card {
        height: 180px;
      }
    }
  </style>
</head>
<body>

  <p class="instrucao">Clique em cada cartão para ler o conteúdo! 📬</p>

  <!-- Cartão 1 -->
  <div class="flip-card">
    <div class="flip-card-inner">
      <div class="flip-card-front">
        <img src="imagens/postal1-frente.jpg" alt="Frente do cartão 1">
      </div>
      <div class="flip-card-back">
        <img src="imagens/postal1-verso.jpg" alt="Verso do cartão 1">
      </div>
    </div>
  </div>

  <!-- Cartão 2 -->
  <div class="flip-card">
    <div class="flip-card-inner">
      <div class="flip-card-front">
        <img src="imagens/postal2-frente.jpg" alt="Frente do cartão 2">
      </div>
      <div class="flip-card-back">
        <img src="imagens/postal2-verso.jpg" alt="Verso do cartão 2">
      </div>
    </div>
  </div>

  <!-- Cartão 3 -->
  <div class="flip-card">
    <div class="flip-card-inner">
      <div class="flip-card-front">
        <img src="imagens/postal3-frente.jpg" alt="Frente do cartão 3">
      </div>
      <div class="flip-card-back">
        <img src="imagens/postal3-verso.jpg" alt="Verso do cartão 3">
      </div>
    </div>
  </div>

  <!-- Cartão 4 -->
  <div class="flip-card">
    <div class="flip-card-inner">
      <div class="flip-card-front">
        <img src="imagens/postal4-frente.jpg" alt="Frente do cartão 4">
      </div>
      <div class="flip-card-back">
        <img src="imagens/postal4-verso.jpg" alt="Verso do cartão 4">
      </div>
    </div>
  </div>

  <!-- Cartão 5 -->
  <div class="flip-card">
    <div class="flip-card-inner">
      <div class="flip-card-front">
        <img src="imagens/postal5-frente.jpg" alt="Frente do cartão 5">
      </div>
      <div class="flip-card-back">
        <img src="imagens/postal5-verso.jpg" alt="Verso do cartão 5">
      </div>
    </div>
  </div>

  <script>
    document.querySelectorAll('.flip-card').forEach(card => {
      card.addEventListener('click', () => {
        card.classList.toggle('flipped');
      });
    });
  </script>

</body>
</html>
